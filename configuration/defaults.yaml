# Library defaults.
#
# Indentation should be tabs.

handlers:
    twitter-archive-write-tweet-with-gallerydl:
        enabled: false
        output_path: "gallery-dl/"
        leaf_folder: "gallery-dl"
        cookie_file: ""
    twitter-manage-archive-cleanup-duplicate-files:
        enabled: false
        trash_path: ""
    webpage-archive-write-webpage-with-wget:
        enabled: false
        output_path: "web-archive/"
        leaf_folder: "wget"
        wait: 2
        limit_rate: "500k"
        cookie_file: ""
    webpage-archive-write-webpage-light-with-wget:
        enabled: false
        output_path: "web-archive/"
        leaf_folder: "wget-text"
        output_as_zip: true
        arguments: []
        arguments_file: ""
        cookie_file: ""
    webpage-archive-write-screenshot-with-screenshot-scraper:
        enabled: false
        output_path: "web-archive/"
        leaf_folder: "screenshot"
        page_script: "library/utilities/screenshot-handler-page.js"
        maximum_height: 16000
        width: 640
        viewport_height: 800
        browser_device_pixel_ratio: 4
        zoom: 1
        reply_count: 3
        cookie_file: ""
    webpage-archive-write-html-with-singlefile:
        enabled: false
        output_path: "web-archive/"
        leaf_folder: "singlefile"
        wait_until: "networkIdle"
        cookie_file: ""
    twitter-archive-export-write-conversation-reconstructed-html:
        enabled: false
        output_path: "web-archive/"
        leaf_folder: "json-to-html"

