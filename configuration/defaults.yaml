# Library defaults.
#
# Indentation should be tabs.

handlers:
    gallery-dl:
        enabled: false
        output_path: dump/
        leaf_folder: ""
        cookie_file: ""
    wget:
        enabled: false
        output_path: web-archive/
        leaf_folder: wget
        wait: 2
        limit_rate: 500k
        cookie_file: ""
    wget-text:
        enabled: false
        output_path: web-archive/
        leaf_folder: wget-text
        output_as_zip: true
        arguments: []
        arguments_file: ""
        cookie_file: ""
    screenshot:
        enabled: false
        output_path: web-archive/
        leaf_folder: screenshot
        page_script: library/utilities/screenshot-handler-page.js
        maximum_height: 16000
        width: "640"
        viewport_height: "800"
        browser_device_pixel_ratio: 4
        zoom: 1
        reply_count: 3
        cookie_file: ""
    singlefile:
        enabled: false
        output_path: web-archive/
        leaf_folder: singlefile
        wait_until: networkIdle
        cookie_file: ""
    json-to-html:
        enabled: false
        output_path: web-archive/
        leaf_folder: json-to-html

