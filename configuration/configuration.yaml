# Example configuration for bibliography-archiver and the webserver.
# Indentation may be tabs. The reader runs: expand -t 4 | yq -o=json
# A missing file is an error. A missing key keeps the shell default.
# --archive-enable-* on the command line overrides enabled for that run.

temporary_files_path: /tmp/bibliography-working-directory

gallery_dl_cookie_file: ""
singlefile_cookie_file: ""
singlefile_library_path: Build/libraries/single-file-cli

screenshot_cookie_file: ""
screenshot_page_script: library/handlers/screenshot-handler-page.js
screenshot_maximum_height: 16000
screenshot_width: "640"
screenshot_viewport_height: "800"
screenshot_browser_device_pixel_ratio: 4
screenshot_zoom: 1
screenshot_reply_count: 3

wget_text_arguments: []
wget_text_arguments_file: ""

handlers:
    gallery-dl:
        enabled: true
        output_path: dump
        leaf_folder: ""
    wget:
        enabled: false
        output_path: web-archive
        leaf_folder: wget
    wget-text:
        enabled: false
        output_path: web-archive
        leaf_folder: wget-text
        output_as_zip: true
    screenshot:
        enabled: true
        output_path: web-archive
        leaf_folder: screenshot
    singlefile:
        enabled: false
        output_path: web-archive
        leaf_folder: singlefile
    json-to-html:
        enabled: false
        output_path: web-archive
        leaf_folder: json-to-html
